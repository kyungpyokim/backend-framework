services:
  redis:
    image: redis:7-alpine
    container_name: spring-dist-redis
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5

  api-node-1:
    build: .
    container_name: spring-api-node-1
    environment:
      - NODE_ID=spring-node-1
      - PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8083:8080"
    depends_on:
      redis:
        condition: service_healthy

  api-node-2:
    build: .
    container_name: spring-api-node-2
    environment:
      - NODE_ID=spring-node-2
      - PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8084:8080"
    depends_on:
      redis:
        condition: service_healthy

  lb:
    image: nginx:alpine
    container_name: spring-load-balancer
    ports:
      - "8082:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-node-1
      - api-node-2
