services:
  # Shared Redis state layer (Lock, PubSub, Stream queue)
  redis:
    image: redis:7-alpine
    container_name: dist-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5

  # API Node #1
  api-node-1:
    build: .
    container_name: dist-api-node-1
    environment:
      - NODE_ID=node-1
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8001:8000"
    depends_on:
      redis:
        condition: service_healthy

  # API Node #2
  api-node-2:
    build: .
    container_name: dist-api-node-2
    environment:
      - NODE_ID=node-2
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8002:8000"
    depends_on:
      redis:
        condition: service_healthy

  # Nginx Round-Robin Load Balancer (Single entry point)
  lb:
    image: nginx:alpine
    container_name: dist-load-balancer
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-node-1
      - api-node-2

  # Distributed Worker #1 (Consumer of Redis Stream)
  worker-1:
    build: .
    container_name: dist-worker-1
    command: uv run python -m app.cases.case2_queue.worker
    environment:
      - WORKER_ID=worker-1
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  # Distributed Worker #2 (Consumer of Redis Stream)
  worker-2:
    build: .
    container_name: dist-worker-2
    command: uv run python -m app.cases.case2_queue.worker
    environment:
      - WORKER_ID=worker-2
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
